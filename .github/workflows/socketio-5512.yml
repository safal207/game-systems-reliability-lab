name: SocketIO 5512 acknowledgement effect matrix

on:
  pull_request:
    paths:
      - 'benchmarks/socketio-5512/**'
      - 'src/reward-ledger.js'
      - '.github/workflows/socketio-5512.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/socketio-5512/**'
      - 'src/reward-ledger.js'
      - '.github/workflows/socketio-5512.yml'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    defaults:
      run:
        working-directory: benchmarks/socketio-5512
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: benchmarks/socketio-5512/package-lock.json
      - name: Install pinned example dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify retained evidence integrity
        run: node verify-evidence.cjs
      - name: Execute native transport and userland validation matrix
        run: npm test
